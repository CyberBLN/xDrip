name: Health Connect read test

# Only in the fork's master branch, so it never becomes part of a pull request.
# Tests the initial Health Connect read of steps and heart rate on Android 14, 15 and 16:
# the hc-writer app writes 12 heart rate samples and three steps records, then xDrip+ is
# installed, Health Connect receive enabled and the stored rows counted.
#   hr:         steps 100,120,150; base vs. the heart rate fix (3), which must store all
#               heart rate samples and steps records
#   zero-steps: steps 100,0,150;   base vs. the library update (7), which must store all
#               three steps records despite the zero-step record
# Base jobs only record what happens; any job fails if the test itself breaks.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Unchanged reference (branch, tag or commit)
        required: true
        default: 98d4171ecfe512d7a54150c3e0511aca7b3a3a75
      fix_hr:
        description: Branch with the heart rate fix (3)
        required: true
        default: fix/health-connect-initial-heart-rate
      fix_lib:
        description: Branch with the library update (7)
        required: true
        default: update/health-connect-client-1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fix-hr, fix-lib]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'base' && inputs.base || matrix.variant == 'fix-hr' && inputs.fix_hr || inputs.fix_lib }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleProdDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/prod/debug/*.apk xdrip-${{ matrix.variant }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: xdrip-${{ matrix.variant }}.apk
          retention-days: 7

  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build hc-writer
        working-directory: .github/emulator/hc-writer
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-hc-writer
          path: .github/emulator/hc-writer/build/outputs/apk/debug/hc-writer-debug.apk
          retention-days: 7

  emulator:
    needs: [build, writer]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
        case:
          - { name: hr-base, variant: base, steps: '100,120,150', expect: '' }
          - { name: hr-fix, variant: fix-hr, steps: '100,120,150', expect: 'expect-hr expect-steps' }
          - { name: zero-steps-base, variant: base, steps: '100,0,150', expect: '' }
          - { name: zero-steps-fix, variant: fix-lib, steps: '100,0,150', expect: 'expect-steps' }
    name: emulator (${{ matrix.api }}, ${{ matrix.case.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.case.variant }}
      - uses: actions/download-artifact@v4
        with:
          name: apk-hc-writer
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/emulator/hc-read-test.sh xdrip-${{ matrix.case.variant }}.apk hc-writer-debug.apk result ${{ matrix.case.steps }} ${{ matrix.case.expect }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-api${{ matrix.api }}-${{ matrix.case.name }}
          path: result
          retention-days: 14
