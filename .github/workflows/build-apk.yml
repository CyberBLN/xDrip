name: Build test APK

# Only in the fork's master branch, so it never becomes part of a pull request.
# Builds any branch on demand and keeps the APK as an artifact.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: fix/health-connect-manage-permissions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon assembleProdDebug testProdDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: xdrip-${{ github.run_number }}-apk
          path: app/build/outputs/apk/prod/debug/*.apk
          retention-days: 14
