name: Build and unit test (release, as upstream)

# Only in the fork's master branch, so it never becomes part of a pull request.
# Builds any branch on demand with the same Gradle tasks and check as upstream's
# unit_test.yml (release variant, APK size check) and keeps the unsigned APKs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: fix/health-connect-manage-permissions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release APKs
        run: ./gradlew --no-daemon assembleProdRelease testProdReleaseUnitTest
      - name: Check output
        run: bash ./etc/CheckBuild/check-release.sh test
      - uses: actions/upload-artifact@v4
        with:
          name: xdrip-${{ github.run_number }}-apk
          path: |
            app/build/outputs/apk/prod/release/*.apk
            wear/build/outputs/apk/prod/release/*.apk
          retention-days: 14
