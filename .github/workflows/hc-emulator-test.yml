name: Health Connect emulator test

# Only in the fork's master branch, so it never becomes part of a pull request.
# Builds the unchanged base and the fix branch, then taps "Manage permissions"
# on Android 13, 14, 15 and 16 emulators and keeps screenshots and logs.
# Android 13 images have no Health Connect app (and no Play Store), so that
# row shows the path where Health Connect cannot be opened at all.
# From Android 14 on the fix job fails if Health Connect does not open; any job fails if the test
# itself breaks (navigation, setup). The base job only records what happens.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Unchanged reference (branch, tag or commit)
        required: true
        default: c42cf55c6b972215654bc2a34ce563c87a7aa594
      fix:
        description: Branch with the fix
        required: true
        default: fix/health-connect-manage-permissions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fix]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'base' && inputs.base || inputs.fix }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleProdDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/prod/debug/*.apk xdrip-${{ matrix.variant }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: xdrip-${{ matrix.variant }}.apk
          retention-days: 7

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35, 36]
        variant: [base, fix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/emulator/hc-manage-permissions-test.sh xdrip-${{ matrix.variant }}.apk result ${{ (matrix.variant == 'fix' && matrix.api >= 34) && 'expect-health-connect' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-api${{ matrix.api }}-${{ matrix.variant }}
          path: result
          retention-days: 14
